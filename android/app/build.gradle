plugins {
    id 'com.android.application'
}

android {
    namespace 'be.dedewa.nexus'
    compileSdk 34

    defaultConfig {
        applicationId 'be.dedewa.nexus'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // clé fixe : les prochaines versions s'installent par-dessus sans désinstaller
    signingConfigs {
        nexus {
            storeFile rootProject.file('nexus.keystore')
            storePassword 'nexus-dedewa'
            keyAlias 'nexus'
            keyPassword 'nexus-dedewa'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.nexus
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
