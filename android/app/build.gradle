plugins {
    id 'com.android.application'
}

android {
    namespace 'be.dedewa.nexus'
    compileSdk 34

    defaultConfig {
        applicationId 'be.dedewa.nexus'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // signé avec la clé de debug : installable directement depuis le téléphone
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
